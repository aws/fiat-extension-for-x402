name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by release.yml on the release tag.
  workflow_call:

permissions:
  contents: read

# A new push to a PR cancels its superseded run. Every other run (push to
# main, manual dispatch) gets its own group via run_id, so none of them is
# cancelled or dropped while pending.
concurrency:
  # Prefixed because, when called from release.yml, github.workflow is the
  # caller's name.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # Every install must come from public npm: each lockfile entry must be the
      # registry.npmjs.org tarball for its own name and version, with an integrity
      # hash, and no committed .npmrc may redirect the registry.
      - name: Check that installs resolve only from the public npm registry
        run: node .github/scripts/check-npm-registry.mjs
      # Fails on a source file without the SPDX header, or an internal hostname
      # or identifier in any tracked file (see internal-hosts-allowlist.txt).
      - name: Check SPDX headers and internal hostnames
        run: node .github/scripts/check-oss-hygiene.mjs
      # Both check scripts gate CI, so they are tested on each Node version
      # CI uses.
      - name: Test the CI check scripts
        run: node --test .github/scripts/tests/check-npm-registry.fixtures.mjs .github/scripts/tests/check-oss-hygiene.fixtures.mjs
      # --ignore-scripts: no dependency lifecycle script runs in CI. Only esbuild
      # and fsevents declare one, and every step passes without them.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Fails when a src/, test/ or examples/ file differs from `npm run format` output.
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run typecheck:test
      # The examples import the package by name; tsconfig.examples.json maps it to src/.
      - run: npm run typecheck:examples
      - run: npm run lint
      - id: coverage
        run: npm run test:coverage
      # One copy is enough: coverage does not differ meaningfully across Node versions.
      - name: Upload the coverage report
        if: ${{ !cancelled() && steps.coverage.conclusion != 'skipped' && matrix.node == '22' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # Every install must come from public npm: each lockfile entry must be the
      # registry.npmjs.org tarball for its own name and version, with an integrity
      # hash, and no committed .npmrc may redirect the registry.
      - name: Check that installs resolve only from the public npm registry
        run: node .github/scripts/check-npm-registry.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Builds once, then runs attw and publint on that build.
      - run: npm run check:package
      - name: Check the package contents
        run: npm pack --dry-run

  # Required check: the package must typecheck and pass its tests on every
  # @x402/core it accepts (peer range >=2.23.0 <3). The lockfile pins one
  # version, so this job also runs the lowest and the newest 2.x. One job with
  # a stable name, so the ruleset lists a single required check.
  x402-core-compat:
    name: x402 core compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # Every install must come from public npm: each lockfile entry must be the
      # registry.npmjs.org tarball for its own name and version, with an integrity
      # hash, and no committed .npmrc may redirect the registry.
      - name: Check that installs resolve only from the public npm registry
        run: node .github/scripts/check-npm-registry.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # The lowest version the peer range accepts. @x402/express (test only)
      # depends on its own core minor, so it moves with core; typecheck:test
      # fails if two core copies are installed.
      - name: Install @x402/core 2.23.0
        run: npm install --no-save --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/ @x402/core@2.23.0 @x402/express@2.23.0
      - name: Typecheck and test on @x402/core 2.23.0
        run: |
          npm ls @x402/core
          npm run typecheck
          npm run typecheck:test
          npm run typecheck:examples
          npm test
      # The newest 2.x, so a new core release is tested before a seller installs it.
      - name: Install the latest @x402/core 2.x
        run: npm install --no-save --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/ "@x402/core@2" "@x402/express@2"
      - name: Typecheck and test on the latest @x402/core 2.x
        run: |
          npm ls @x402/core
          npm run typecheck
          npm run typecheck:test
          npm run typecheck:examples
          npm test
