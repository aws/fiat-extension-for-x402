name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by release.yml on the release tag.
  workflow_call:

permissions:
  contents: read

# A new push to a PR cancels its superseded run. Every other run (push to
# main, manual dispatch) gets its own group via run_id, so none of them is
# cancelled or dropped while pending.
concurrency:
  # Prefixed because, when called from release.yml, github.workflow is the
  # caller's name.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # Every install must come from public npm: each lockfile entry must be the
      # registry.npmjs.org tarball for its own name and version, with an integrity
      # hash, and no committed .npmrc may redirect the registry.
      - name: Check that installs resolve only from the public npm registry
        run: node .github/scripts/check-npm-registry.mjs
      # Fails on a source file without the SPDX header, or an internal hostname
      # or identifier in any tracked file (see internal-hosts-allowlist.txt).
      - name: Check SPDX headers and internal hostnames
        run: node .github/scripts/check-oss-hygiene.mjs
      # Both check scripts gate CI, so they are tested on each Node version
      # CI uses.
      - name: Test the CI check scripts
        run: node --test .github/scripts/tests/check-npm-registry.fixtures.mjs .github/scripts/tests/check-oss-hygiene.fixtures.mjs
      # --ignore-scripts: no dependency lifecycle script runs in CI. Only esbuild
      # and fsevents declare one, and every step passes without them.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Fails when a src/ or test/ file differs from `npm run format` output.
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - id: coverage
        run: npm run test:coverage
      # One copy is enough: coverage does not differ meaningfully across Node versions.
      - name: Upload the coverage report
        if: ${{ !cancelled() && steps.coverage.conclusion != 'skipped' && matrix.node == '22' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # Every install must come from public npm: each lockfile entry must be the
      # registry.npmjs.org tarball for its own name and version, with an integrity
      # hash, and no committed .npmrc may redirect the registry.
      - name: Check that installs resolve only from the public npm registry
        run: node .github/scripts/check-npm-registry.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run attw
      - run: npm run publint
      - name: Check the package contents
        run: npm pack --dry-run

  # A required @x402/core compatibility matrix arrives with the exact scheme rewrite.
