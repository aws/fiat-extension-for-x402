name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its superseded run. Every other run (push to
# main, manual dispatch) gets its own group via run_id, so none of them is
# cancelled or dropped while pending.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # Every install must come from public npm: no lockfile entry may resolve
      # elsewhere, and no committed .npmrc may redirect the registry (npm would
      # otherwise rewrite registry.npmjs.org URLs to that host during npm ci).
      - name: Check that installs resolve only from the public npm registry
        run: |
          if [ -f .npmrc ] && grep -nE '^[[:space:]]*(registry|replace-registry-host|@[^:=]+:registry)[[:space:]]*=' .npmrc; then
            echo "::error file=.npmrc::.npmrc must not set registry, a scoped registry or replace-registry-host"
            exit 1
          fi
          node -e '
            const prefix = "https://registry.npmjs.org/";
            const { packages } = require("./package-lock.json");
            if (!packages || typeof packages !== "object") {
              console.log("::error file=package-lock.json::package-lock.json has no packages map (lockfileVersion 2 or 3 required)");
              process.exit(1);
            }
            const bad = Object.entries(packages)
              .filter(([path, entry]) => path !== "" && !entry.link)
              .filter(([, entry]) => typeof entry.resolved !== "string" || !entry.resolved.startsWith(prefix))
              .map(([path, entry]) => `${path}: ${entry.resolved}`);
            if (bad.length) {
              bad.forEach((line) => console.log(line));
              console.log("::error file=package-lock.json::Every resolved URL must start with " + prefix);
              process.exit(1);
            }
          '
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - id: coverage
        run: npm run test:coverage
      # One copy is enough: coverage does not differ meaningfully across Node versions.
      - name: Upload the coverage report
        if: ${{ !cancelled() && steps.coverage.conclusion != 'skipped' && matrix.node == '22' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # Every install must come from public npm: no lockfile entry may resolve
      # elsewhere, and no committed .npmrc may redirect the registry (npm would
      # otherwise rewrite registry.npmjs.org URLs to that host during npm ci).
      - name: Check that installs resolve only from the public npm registry
        run: |
          if [ -f .npmrc ] && grep -nE '^[[:space:]]*(registry|replace-registry-host|@[^:=]+:registry)[[:space:]]*=' .npmrc; then
            echo "::error file=.npmrc::.npmrc must not set registry, a scoped registry or replace-registry-host"
            exit 1
          fi
          node -e '
            const prefix = "https://registry.npmjs.org/";
            const { packages } = require("./package-lock.json");
            if (!packages || typeof packages !== "object") {
              console.log("::error file=package-lock.json::package-lock.json has no packages map (lockfileVersion 2 or 3 required)");
              process.exit(1);
            }
            const bad = Object.entries(packages)
              .filter(([path, entry]) => path !== "" && !entry.link)
              .filter(([, entry]) => typeof entry.resolved !== "string" || !entry.resolved.startsWith(prefix))
              .map(([path, entry]) => `${path}: ${entry.resolved}`);
            if (bad.length) {
              bad.forEach((line) => console.log(line));
              console.log("::error file=package-lock.json::Every resolved URL must start with " + prefix);
              process.exit(1);
            }
          '
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run attw
      - run: npm run publint
      - name: Check the package contents
        run: npm pack --dry-run

  # A required @x402/core compatibility matrix arrives with the exact scheme rewrite.
